if(v==='n'&&!window.nb){window.nb=1;buildNet()}
if(v==='c'&&!vc.innerHTML)vc.innerHTML=CH.map(c=>`<div class="ch"><b>${c[0]}</b><p>${c[1]}</p><div class="pp">${c[2].map(k=>`<span class="c" onclick="showV('m');goR('${k}')">${R[k].n}</span>`).join('')}</div></div>`).join('')}
showV('m');
function buildNet(){const W=760,x0=150,x1=740,y0=58,lh=21,H=y0+P.length*lh+24,X=y=>typeof y==='number'?x0+(y-1880)*(x1-x0)/50:126;
const s=mk('svg',{id:'nsv',viewBox:`0 0 ${W} ${H}`,xmlns:NS},document.getElementById('net'));
mk('rect',{x:0,y:0,width:W,height:H,fill:'#fffdf8'},s);
P.forEach((p,i)=>mk('rect',{x:0,y:y0+i*lh-lh/2,width:W,height:lh,fill:R[p[1]].c,opacity:.09},s));
for(let y=1880;y<=1930;y+=10){mk('line',{x1:X(y),y1:34,x2:X(y),y2:H-10,stroke:'#d9d2c3'},s);if(y>1880)mk('text',{x:X(y),y:28,'text-anchor':'middle','font-size':12,fill:'#7a7468'},s).textContent=y}
mk('text',{x:126,y:28,'text-anchor':'middle','font-size':11,fill:'#7a7468'},s).textContent='미상';
mk('line',{x1:X(1907),y1:34,x2:X(1907),y2:H-10,stroke:'#b8325a','stroke-dasharray':'4 3','stroke-width':1.5},s);mk('text',{x:X(1907),y:46,'text-anchor':'middle','font-size':10.5,fill:'#b8325a'},s).textContent='1907 대부흥';
const pos=P.map((p,i)=>[X(p[2][0][0]),y0+i*lh]);
L.forEach(l=>{const a=P.findIndex(p=>p[0]===l[0]),b=P.findIndex(p=>p[0]===l[1]);if(a<0||b<0)return;const[xa,ya]=pos[a],[xb,yb]=pos[b];
const e=mk('path',{d:`M${xa},${ya} Q${Math.min(xa,xb)-26},${(ya+yb)/2} ${xb},${yb}`,fill:'none',stroke:'#a7683a','stroke-width':1.5,opacity:.55},s);mk('title',{},e).textContent=l[2];links.push({el:e,a,b})});
P.forEach((p,i)=>{const y=y0+i*lh,t=mk('text',{x:8,y:y+4,'font-size':11.5,'font-weight':700,fill:'#23201b',style:'cursor:pointer'},s);t.textContent=p[0];t.onclick=()=>sel(i);
p[2].forEach(e=>{const c=mk('circle',{cx:X(e[0]),cy:y,r:5,fill:R[e[2]||p[1]].c,stroke:'#fff','stroke-width':1.5,style:'cursor:pointer'},s);c.onclick=()=>sel(i);mk('title',{},c).textContent=e[0]+' '+e[1]})})}
function sel(i){const p=P[i],r=R[p[1]];links.forEach(l=>{const on=l.a===i||l.b===i;l.el.setAttribute('stroke-width',on?3:1.5);l.el.setAttribute('opacity',on?1:.2)});
const rel=L.filter(l=>l[0]===p[0]||l[1]===p[0]);
PN.innerHTML=`<div class="hd" style="background:${r.c}"><b>${p[0]}</b><div>${r.n} · 연도별 활동</div></div><div class="bd" style="--c:${r.c}"><h3>활동</h3><div class="tl">${p[2].map(e=>`<div class="ev"><b>${e[0]}</b><p>${e[1]}</p></div>`).join('')}</div>${rel.length?'<h3>연결</h3><div class="pp">'+rel.map(l=>{const o=l[0]===p[0]?l[1]:l[0];return `<span class="c" onclick="goP('${o}')">${o} · ${l[2]}</span>`}).join('')+'</div>':''}<div class="pp" style="margin-top:12px"><span class="c" onclick="showV('m');goR('${p[1]}')">지도에서 ${r.n} 열기</span></div><div class="ft">출처: 박영철 석사학위논문 ${r.pg}</div></div>`;PN.scrollIntoView({behavior:'smooth',block:'nearest'})}
function goP(c){const t=c.split(/[( ·]/)[0],i=P.findIndex(p=>c.includes(p[0].split(/[( ·]/)[0])||p[0].includes(t));if(i<0)return;showV('n');sel(i)}
const oldDm=dm.onclick;
dm.onclick=()=>{if(view!=='n')return oldDm();const s=document.getElementById('nsv').cloneNode(true),vb=s.getAttribute('viewBox').split(' ');s.setAttribute('width',vb[2]*2.5);s.setAttribute('height',vb[3]*2.5);
const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=vb[2]*2.5;cv.height=vb[3]*2.5;cv.getContext('2d').drawImage(im,0,0);dl(cv,'사경회_연도별_인물_네트워크.png')};
im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))};
</script></body></html>
